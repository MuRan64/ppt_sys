name: Build macOS applications

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel
            runner: macos-13
            expected_arch: x86_64
          - name: arm64
            runner: macos-14
            expected_arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify runner architecture
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          echo "Runner architecture: ${actual_arch}"
          test "${actual_arch}" = "${{ matrix.expected_arch }}"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-release.txt

      - name: Build application
        run: python -m PyInstaller --clean --noconfirm packaging/fbd_to_ppt.spec

      - name: Package application
        shell: bash
        run: |
          if [ -d "dist/FbdToPpt.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/FbdToPpt.app" "FbdToPpt-macos-${{ matrix.name }}.zip"
          else
            ditto -c -k --sequesterRsrc --keepParent "dist/FbdToPpt" "FbdToPpt-macos-${{ matrix.name }}.zip"
          fi

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: FbdToPpt-macos-${{ matrix.name }}
          path: FbdToPpt-macos-${{ matrix.name }}.zip
          if-no-files-found: error
