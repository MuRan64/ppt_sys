name: Build macOS Universal 2 application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS universal2
    # The Python.org universal2 installer is used on an Apple Silicon host.
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install universal2 Python
        shell: bash
        run: |
          set -euo pipefail
          python_version="3.11.9"
          installer="python-${python_version}-macos11.pkg"
          curl --fail --location --retry 3 \
            "https://www.python.org/ftp/python/${python_version}/${installer}" \
            --output "${RUNNER_TEMP}/${installer}"
          sudo installer -pkg "${RUNNER_TEMP}/${installer}" -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> "${GITHUB_PATH}"

      - name: Verify universal2 Python
        shell: bash
        run: |
          set -euo pipefail
          python3.11 --version
          python_binary="$(command -v python3.11)"
          file "${python_binary}"
          lipo -info "${python_binary}"

      - name: Create build environment
        shell: bash
        run: |
          set -euo pipefail
          python3.11 -m venv "${RUNNER_TEMP}/fbd-universal2-venv"
          echo "${RUNNER_TEMP}/fbd-universal2-venv/bin" >> "${GITHUB_PATH}"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt

      - name: Build Universal 2 application
        run: |
          python -m PyInstaller --clean --noconfirm \
            --target-architecture universal2 \
            packaging/fbd_to_ppt.spec

      - name: Verify application architectures
        shell: bash
        run: |
          set -euo pipefail
          app_binary="dist/FbdToPpt.app/Contents/MacOS/FbdToPpt"
          test -f "${app_binary}"
          file "${app_binary}"
          lipo -info "${app_binary}"

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/FbdToPpt.app" "FbdToPpt-macos-universal2.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: FbdToPpt-macos-universal2
          path: FbdToPpt-macos-universal2.zip
          if-no-files-found: error
